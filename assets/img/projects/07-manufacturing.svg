<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manufacturing">
  <defs>
    <linearGradient id="g07" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e4a5a"/>
      <stop offset="100%" stop-color="#1c2330"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g07)"/>

  <!-- Smoke from chimney -->
  <g fill="rgba(255,255,255,0.13)">
    <ellipse cx="240" cy="118" rx="20" ry="13"/>
    <ellipse cx="256" cy="90" rx="26" ry="17"/>
    <ellipse cx="236" cy="65" rx="32" ry="20"/>
    <ellipse cx="262" cy="40" rx="24" ry="15"/>
  </g>

  <!-- Big gear (upper right) -->
  <g transform="translate(640,170)">
    <g fill="rgba(255,255,255,0.7)">
      <rect x="-7" y="-72" width="14" height="20" rx="2"/>
      <rect x="-7" y="52" width="14" height="20" rx="2"/>
      <rect x="-72" y="-7" width="20" height="14" rx="2"/>
      <rect x="52" y="-7" width="20" height="14" rx="2"/>
      <g transform="rotate(45)"><rect x="-7" y="-72" width="14" height="20" rx="2"/></g>
      <g transform="rotate(-45)"><rect x="-7" y="-72" width="14" height="20" rx="2"/></g>
      <g transform="rotate(135)"><rect x="-7" y="-72" width="14" height="20" rx="2"/></g>
      <g transform="rotate(-135)"><rect x="-7" y="-72" width="14" height="20" rx="2"/></g>
    </g>
    <circle cx="0" cy="0" r="58" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="18" fill="rgba(28,35,48,1)" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="rgba(255,255,255,0.85)"/>
    <line x1="-46" y1="0" x2="-22" y2="0" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <line x1="46" y1="0" x2="22" y2="0" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <line x1="0" y1="-46" x2="0" y2="-22" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <line x1="0" y1="46" x2="0" y2="22" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  </g>

  <!-- Main factory building with sawtooth roof -->
  <g stroke="rgba(255,255,255,0.55)" stroke-width="1.8">
    <path d="M120 340 L120 235 L160 205 L160 235 L200 205 L200 235 L240 205 L240 235 L280 205 L280 340 Z"
          fill="rgba(255,255,255,0.16)"/>
    <!-- Chimney -->
    <rect x="244" y="130" width="22" height="78" fill="rgba(255,255,255,0.18)"/>
    <rect x="240" y="125" width="30" height="8" fill="rgba(255,255,255,0.3)"/>
    <!-- Door -->
    <rect x="192" y="300" width="24" height="40" fill="rgba(255,255,255,0.32)"/>
    <!-- Windows -->
    <g fill="rgba(255,220,140,0.5)">
      <rect x="138" y="260" width="16" height="16"/>
      <rect x="168" y="260" width="16" height="16"/>
      <rect x="222" y="260" width="16" height="16"/>
      <rect x="252" y="260" width="16" height="16"/>
    </g>
  </g>

  <!-- Second building -->
  <g stroke="rgba(255,255,255,0.45)" stroke-width="1.5">
    <rect x="320" y="245" width="180" height="95" fill="rgba(255,255,255,0.12)"/>
    <g fill="rgba(255,220,140,0.42)">
      <rect x="335" y="260" width="18" height="18"/>
      <rect x="365" y="260" width="18" height="18"/>
      <rect x="395" y="260" width="18" height="18"/>
      <rect x="425" y="260" width="18" height="18"/>
      <rect x="455" y="260" width="18" height="18"/>
      <rect x="335" y="295" width="18" height="18"/>
      <rect x="365" y="295" width="18" height="18"/>
      <rect x="395" y="295" width="18" height="18"/>
      <rect x="425" y="295" width="18" height="18"/>
      <rect x="455" y="295" width="18" height="18"/>
    </g>
  </g>

  <!-- Conveyor belt -->
  <g stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none">
    <line x1="320" y1="370" x2="540" y2="370"/>
    <circle cx="328" cy="378" r="8" fill="rgba(255,255,255,0.18)"/>
    <circle cx="370" cy="378" r="8" fill="rgba(255,255,255,0.18)"/>
    <circle cx="412" cy="378" r="8" fill="rgba(255,255,255,0.18)"/>
    <circle cx="454" cy="378" r="8" fill="rgba(255,255,255,0.18)"/>
    <circle cx="496" cy="378" r="8" fill="rgba(255,255,255,0.18)"/>
    <circle cx="532" cy="378" r="8" fill="rgba(255,255,255,0.18)"/>
  </g>
  <g fill="rgba(255,255,255,0.4)">
    <rect x="350" y="355" width="14" height="14"/>
    <rect x="420" y="355" width="14" height="14"/>
    <rect x="490" y="355" width="14" height="14"/>
  </g>

  <!-- Ground line -->
  <line x1="0" y1="340" x2="800" y2="340" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>

  <!-- Title -->
  <text x="40" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="rgba(255,255,255,0.95)">Manufacturing</text>
  <text x="40" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">PROCESS MONITORING · ML · GE RESEARCH</text>
</svg>
