<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sustainable energy systems">
  <defs>
    <linearGradient id="g06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c6a52"/>
      <stop offset="55%" stop-color="#1f4e3a"/>
      <stop offset="100%" stop-color="#15362a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g06)"/>

  <!-- Sun -->
  <circle cx="720" cy="95" r="38" fill="rgba(255,230,150,0.25)"/>
  <g stroke="rgba(255,230,150,0.35)" stroke-width="1.5" stroke-linecap="round">
    <line x1="720" y1="38" x2="720" y2="20"/>
    <line x1="755" y1="50" x2="772" y2="40"/>
    <line x1="775" y1="95" x2="795" y2="95"/>
    <line x1="755" y1="140" x2="772" y2="150"/>
    <line x1="685" y1="50" x2="668" y2="40"/>
    <line x1="665" y1="95" x2="645" y2="95"/>
  </g>

  <!-- Leaf (top-left) -->
  <g fill="rgba(180,230,170,0.55)">
    <path d="M52 70 Q 90 60 100 100 Q 95 140 55 140 Q 25 132 30 100 Q 35 80 52 70 Z"/>
  </g>
  <line x1="60" y1="125" x2="100" y2="100" stroke="rgba(180,230,170,0.7)" stroke-width="1.2"/>
  <line x1="62" y1="115" x2="85" y2="105" stroke="rgba(180,230,170,0.5)" stroke-width="1"/>
  <line x1="64" y1="105" x2="78" y2="98" stroke="rgba(180,230,170,0.5)" stroke-width="1"/>

  <!-- Ground -->
  <line x1="0" y1="340" x2="800" y2="340" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

  <!-- Wind turbine -->
  <line x1="155" y1="340" x2="155" y2="160" stroke="rgba(255,255,255,0.85)" stroke-width="3"/>
  <circle cx="155" cy="160" r="6" fill="rgba(255,255,255,0.95)"/>
  <g stroke="rgba(255,255,255,0.85)" stroke-width="4" stroke-linecap="round">
    <line x1="155" y1="160" x2="155" y2="90"/>
    <line x1="155" y1="160" x2="216" y2="195"/>
    <line x1="155" y1="160" x2="94" y2="195"/>
  </g>

  <!-- Transmission tower -->
  <g stroke="rgba(255,255,255,0.85)" stroke-width="2" fill="none">
    <polygon points="378,340 422,340 412,170 388,170" fill="rgba(255,255,255,0.15)"/>
    <line x1="378" y1="340" x2="422" y2="265"/>
    <line x1="422" y1="340" x2="378" y2="265"/>
    <line x1="383" y1="265" x2="417" y2="215"/>
    <line x1="417" y1="265" x2="383" y2="215"/>
    <line x1="340" y1="200" x2="460" y2="200"/>
    <line x1="350" y1="180" x2="450" y2="180"/>
    <line x1="365" y1="200" x2="365" y2="218"/>
    <line x1="400" y1="180" x2="400" y2="198"/>
    <line x1="435" y1="200" x2="435" y2="218"/>
  </g>

  <!-- Solar array -->
  <polygon points="592,318 728,318 752,250 568,250" fill="rgba(95,150,210,0.55)" stroke="rgba(255,255,255,0.55)" stroke-width="1.8"/>
  <g stroke="rgba(255,255,255,0.55)" stroke-width="1" fill="none">
    <line x1="588" y1="284" x2="740" y2="284"/>
    <line x1="610" y1="250" x2="618" y2="318"/>
    <line x1="650" y1="250" x2="656" y2="318"/>
    <line x1="690" y1="250" x2="694" y2="318"/>
    <line x1="730" y1="250" x2="732" y2="318"/>
  </g>
  <line x1="630" y1="285" x2="640" y2="340" stroke="rgba(255,255,255,0.75)" stroke-width="2"/>
  <line x1="700" y1="285" x2="712" y2="340" stroke="rgba(255,255,255,0.75)" stroke-width="2"/>

  <!-- Power lines -->
  <g stroke="rgba(255,255,255,0.55)" stroke-width="1.2" fill="none">
    <path d="M155 160 Q 270 175 360 200"/>
    <path d="M155 180 Q 270 195 360 220"/>
    <path d="M440 200 Q 520 225 600 250"/>
    <path d="M440 220 Q 520 245 600 270"/>
  </g>

  <!-- Title -->
  <text x="40" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="rgba(255,255,255,0.95)">Sustainable Energy Systems</text>
  <text x="40" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">POWER GRIDS · BUILDINGS · RENEWABLES</text>
</svg>
