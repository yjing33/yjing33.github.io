<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prediction-augmented control">
  <defs>
    <linearGradient id="g03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37475b"/>
      <stop offset="100%" stop-color="#1a2230"/>
    </linearGradient>
    <marker id="arrow03" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="rgba(255,255,255,0.72)"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#g03)"/>

  <!-- Forecast versus realized trajectory -->
  <rect x="92" y="112" width="356" height="202" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.42)" stroke-width="2"/>
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1.4">
    <line x1="126" y1="264" x2="406" y2="264"/>
    <line x1="126" y1="212" x2="406" y2="212"/>
    <line x1="126" y1="160" x2="406" y2="160"/>
  </g>
  <path d="M128 248 C170 214 205 219 244 184 S326 140 406 172"
        stroke="rgba(255,255,255,0.84)" stroke-width="4.4" fill="none" stroke-linecap="round"/>
  <path d="M128 248 C172 225 208 235 247 209 S328 188 406 222"
        stroke="rgba(232,217,176,0.78)" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-dasharray="10 8"/>

  <!-- Adaptive controller as simple tuning block -->
  <rect x="554" y="148" width="138" height="132" rx="10" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  <g stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round">
    <line x1="586" y1="188" x2="660" y2="188"/>
    <line x1="586" y1="218" x2="660" y2="218"/>
    <line x1="586" y1="248" x2="660" y2="248"/>
  </g>
  <g fill="rgba(232,217,176,0.9)" stroke="rgba(232,217,176,0.9)">
    <circle cx="612" cy="188" r="6"/>
    <circle cx="642" cy="218" r="6"/>
    <circle cx="604" cy="248" r="6"/>
  </g>

  <path d="M448 213 L542 213" stroke="rgba(255,255,255,0.62)" stroke-width="3" fill="none" marker-end="url(#arrow03)"/>

  <line x1="0" y1="340" x2="800" y2="340" stroke="rgba(255,255,255,0.24)" stroke-width="1.2"/>
  <text x="40" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="rgba(255,255,255,0.95)">Prediction-Augmented Control</text>
  <text x="40" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">ONLINE PREDICTIONS | COMMUNICATION | ADAPTATION</text>
</svg>
